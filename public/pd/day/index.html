<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/images/first.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day — Velocity Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;scroll-behavior:smooth;}
:root{
  --bg:#0d1c2e;
  --bg-soft:#14283f;
  --card:#192f4c;
  --card-hover:#1f3a5e;
  --border:#1d3a5c;
  --border-bright:#2d5482;
  --cyan:#00B4C9;
  --cyan-soft:#6FDDEC;
  --cyan-dim:#005F6B;
  --ink:#E8F0F4;
  --ink-soft:#B8C9D6;
  --ink-mute:#7A8B94;
  --ink-dim:#5D7283;
  --amber:#F5D799;
  --amber-bg:#3a2e10;
}
body{font-family:'Work Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased;}

/* ─── Header ─── */
.accent{height:0.25rem;background:var(--cyan);}
.header{padding:2rem 2rem 1.5rem;border-bottom:0.0625rem solid var(--border);}
.header-inner{max-width:64rem;margin:0 auto;}
.kicker{font-size:0.75rem;font-weight:700;color:var(--cyan);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:0.625rem;}
.title{font-size:2.25rem;font-weight:800;color:var(--ink);line-height:1.1;letter-spacing:-0.01em;margin-bottom:0.5rem;}
.subtitle{font-size:1rem;color:var(--ink-mute);max-width:42rem;}
.back-link{display:inline-block;font-size:0.875rem;color:var(--cyan);text-decoration:none;margin-bottom:1rem;font-weight:600;}
.back-link:hover{color:var(--cyan-soft);}

/* ─── Day nav ─── */
.day-nav{display:flex;align-items:center;gap:0.5rem;margin-top:1.25rem;}
.nav-btn{background:var(--bg-soft);border:0.0625rem solid var(--border-bright);color:var(--ink);font-family:inherit;font-size:0.875rem;font-weight:600;padding:0.5rem 0.875rem;border-radius:0.375rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:0.375rem;}
.nav-btn:hover{background:var(--card);border-color:var(--cyan);color:var(--cyan);}
.nav-btn:disabled,.nav-btn.disabled{opacity:0.35;cursor:not-allowed;pointer-events:none;}
.day-select{background:var(--bg-soft);border:0.0625rem solid var(--border-bright);color:var(--ink);font-family:inherit;font-size:0.875rem;font-weight:600;padding:0.5rem 0.75rem;border-radius:0.375rem;cursor:pointer;flex:1;max-width:18rem;}
.day-select:focus{outline:none;border-color:var(--cyan);}

/* ─── Main ─── */
.main{max-width:64rem;margin:0 auto;padding:2rem;}

/* ─── Hero (theme + big idea) ─── */
.hero{background:linear-gradient(135deg,var(--card) 0%,var(--card-hover) 100%);border:0.0625rem solid var(--border-bright);border-radius:0.75rem;padding:1.5rem 1.75rem;margin-bottom:2.5rem;}
.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;}
.hero-item{}
.hero-label{font-size:0.6875rem;font-weight:700;color:var(--cyan);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:0.375rem;}
.hero-value{font-size:0.9375rem;color:var(--ink);line-height:1.55;}
@media (max-width:640px){.hero-row{grid-template-columns:1fr;}}

/* ─── Phase sections ─── */
.phase{padding:1.75rem 0;border-top:0.0625rem solid var(--border);scroll-margin-top:2rem;}
.phase:first-of-type{border-top:none;padding-top:0;}
.phase-head{display:flex;align-items:baseline;gap:1rem;margin-bottom:0.625rem;flex-wrap:wrap;}
.phase-num{font-family:'JetBrains Mono','SF Mono',monospace;font-size:0.8125rem;font-weight:700;color:var(--cyan);letter-spacing:0.08em;background:var(--cyan-dim);padding:0.25rem 0.5rem;border-radius:0.25rem;}
.phase-title{font-size:1.25rem;font-weight:800;color:var(--ink);letter-spacing:-0.01em;flex:1;}
.phase-meta{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.75rem;}
.chip{font-size:0.6875rem;font-weight:700;color:var(--ink-soft);letter-spacing:0.08em;text-transform:uppercase;background:var(--bg-soft);border:0.0625rem solid var(--border);padding:0.25rem 0.5rem;border-radius:0.25rem;}
.chip-mins{color:var(--cyan);border-color:var(--cyan-dim);}
.phase-context{font-size:0.9375rem;color:var(--ink-soft);line-height:1.65;margin-bottom:1rem;max-width:48rem;}
.phase-context em{color:var(--cyan-soft);font-style:italic;}
.phase-context a,.phase-context a:visited{color:var(--cyan);text-decoration:underline;text-decoration-color:rgba(0,180,201,0.4);text-underline-offset:0.2em;}
.phase-context a:hover{color:var(--cyan-soft);text-decoration-color:var(--cyan-soft);}

/* ─── Facilitator notes (collapsible) ─── */
.fac-notes{background:var(--bg-soft);border-left:0.25rem solid var(--amber);border-radius:0 0.375rem 0.375rem 0;margin-bottom:1rem;}
.fac-notes summary{cursor:pointer;padding:0.625rem 1rem;font-size:0.75rem;font-weight:700;color:var(--amber);letter-spacing:0.12em;text-transform:uppercase;list-style:none;display:flex;align-items:center;justify-content:space-between;}
.fac-notes summary::-webkit-details-marker{display:none;}
.fac-notes summary::after{content:'+';font-size:1.125rem;font-weight:600;color:var(--amber);}
.fac-notes[open] summary::after{content:'−';}
.fac-notes-body{padding:0 1rem 1rem;font-size:0.875rem;color:var(--ink-soft);line-height:1.6;}
.fac-notes-body em{color:var(--amber);font-style:italic;}

/* ─── Resource cards ─── */
.resources{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:0.5rem;}
.resource{display:flex;align-items:flex-start;gap:0.625rem;background:var(--card);border:0.0625rem solid var(--border);border-radius:0.5rem;padding:0.75rem 0.875rem;text-decoration:none;color:inherit;transition:border-color 0.15s,background 0.15s,transform 0.1s;}
.resource:hover{border-color:var(--cyan);background:var(--card-hover);transform:translateY(-1px);}
.resource-icon{width:1.75rem;height:1.75rem;background:var(--bg);border:0.0625rem solid var(--border-bright);border-radius:0.375rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--cyan);font-weight:700;font-size:0.875rem;}
.resource-body{flex:1;min-width:0;}
.resource-title{font-size:0.875rem;font-weight:600;color:var(--cyan);line-height:1.3;}
.resource-meta{font-size:0.6875rem;color:var(--ink-mute);margin-top:0.125rem;text-transform:uppercase;letter-spacing:0.06em;}

/* ─── Footer ─── */
.footer{max-width:64rem;margin:3rem auto 0;padding:2rem;border-top:0.0625rem solid var(--border);text-align:center;color:var(--ink-mute);font-size:0.875rem;}
.footer a{color:var(--cyan);text-decoration:none;}
.footer a:hover{color:var(--cyan-soft);}

.empty{text-align:center;padding:4rem 2rem;color:var(--ink-mute);}
.empty h2{font-size:1.5rem;color:var(--ink);margin-bottom:0.5rem;}
.empty p{font-size:0.9375rem;}

@media (max-width: 640px){
  .header{padding:1.5rem 1.25rem 1.25rem;}
  .title{font-size:1.625rem;}
  .main{padding:1.5rem 1.25rem;}
}
</style>
</head>
<body>

<div class="accent"></div>

<div class="header">
  <div class="header-inner">
    <a href="/teachers.html" class="back-link">← Teacher Resources</a>
    <div class="kicker" id="kicker">Velocity Arena · Day</div>
    <h1 class="title" id="title">Loading…</h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="day-nav">
      <a class="nav-btn" id="prev-btn" href="#">← Prev</a>
      <select class="day-select" id="day-select" onchange="goToDay(this.value)"></select>
      <a class="nav-btn" id="next-btn" href="#">Next →</a>
    </div>
  </div>
</div>

<div class="main" id="main">
  <!-- Hero + phases rendered dynamically -->
</div>

<footer class="footer">
  <p>Velocity Arena · Daily session view · <a href="/pd/project-slice/">Project Slice PD</a> · <a href="/teachers.html">Teacher Resources</a></p>
</footer>

<script src="/days-default.js"></script>
<script>
const dayParam = new URLSearchParams(location.search).get('day');
const dayNum = parseInt(dayParam, 10) || 1;
const days = (typeof DAYS_DEFAULT !== 'undefined') ? DAYS_DEFAULT : [];
const day = days.find(d => d.day === dayNum);

// Resource icon map — distinguishes resource types at a glance.
const RES_ICONS = {
  worksheet:  '↓',
  script:     '☰',
  quickCard:  '◇',
  exemplar:   '★',
  makecode:   '◧',
  template:   '⬚',
  webpage:    '↗',
  link:       '↗',
};
const RES_LABELS = {
  worksheet:  'Worksheet · PDF',
  script:     'Facilitator script · Doc',
  quickCard:  'Quick card · activity reference',
  exemplar:   'Exemplar · what good looks like',
  makecode:   'MakeCode · starter project',
  template:   'Template · Doc',
  webpage:    'Lesson page',
  link:       'Activity page',
};

function escapeHTML(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildResources(activity) {
  const cards = [];

  // Worksheet can be a string, a {url, label} object, or an array of those.
  const ws = activity.worksheet;
  if (Array.isArray(ws)) {
    ws.forEach(w => {
      if (w && w.url) cards.push({ icon: RES_ICONS.worksheet, title: w.label || 'Worksheet', meta: 'PDF', href: w.url });
    });
  } else if (ws && typeof ws === 'object' && ws.url) {
    cards.push({ icon: RES_ICONS.worksheet, title: ws.label || 'Worksheet', meta: 'PDF', href: ws.url });
  } else if (typeof ws === 'string' && ws) {
    cards.push({ icon: RES_ICONS.worksheet, title: 'Worksheet', meta: 'PDF', href: ws });
  }

  // Template can be string OR {url, label}.
  if (activity.template) {
    if (typeof activity.template === 'object' && activity.template.url) {
      cards.push({ icon: RES_ICONS.template, title: activity.template.label || 'Template', meta: 'Doc', href: activity.template.url });
    } else if (typeof activity.template === 'string') {
      cards.push({ icon: RES_ICONS.template, title: 'Template', meta: 'Doc', href: activity.template });
    }
  }

  // Simple string fields.
  const simple = ['script', 'quickCard', 'exemplar', 'makecode', 'webpage', 'link'];
  simple.forEach(key => {
    const val = activity[key];
    if (typeof val === 'string' && val) {
      cards.push({
        icon: RES_ICONS[key] || '↗',
        title: ({script:'Facilitator script', quickCard:'Quick card', exemplar:'Exemplar', makecode:'MakeCode project', webpage:'Lesson page', link:'Activity page'})[key],
        meta: RES_LABELS[key],
        href: val
      });
    }
  });

  return cards;
}

function renderResources(cards) {
  if (!cards.length) return '';
  const html = cards.map(c => `
    <a class="resource" href="${escapeHTML(c.href)}" target="_blank" rel="noopener">
      <div class="resource-icon">${escapeHTML(c.icon)}</div>
      <div class="resource-body">
        <div class="resource-title">${escapeHTML(c.title)}</div>
        <div class="resource-meta">${escapeHTML(c.meta)}</div>
      </div>
    </a>
  `).join('');
  return `<div class="resources">${html}</div>`;
}

function renderPhase(activity, idx) {
  const num = String(idx + 1).padStart(2, '0');
  const cards = buildResources(activity);
  const hasFac = activity.facilitatorDescription && activity.facilitatorDescription.trim();
  return `
    <section class="phase">
      <div class="phase-head">
        <span class="phase-num">${num}</span>
        <h2 class="phase-title">${escapeHTML(activity.name || '')}</h2>
      </div>
      <div class="phase-meta">
        ${activity.block ? `<span class="chip">${escapeHTML(activity.block)}</span>` : ''}
        ${activity.mins ? `<span class="chip chip-mins">${activity.mins} min</span>` : ''}
      </div>
      ${activity.description ? `<p class="phase-context">${escapeHTML(activity.description)}</p>` : ''}
      ${hasFac ? `
        <details class="fac-notes">
          <summary>Facilitator notes</summary>
          <div class="fac-notes-body">${escapeHTML(activity.facilitatorDescription)}</div>
        </details>
      ` : ''}
      ${renderResources(cards)}
    </section>
  `;
}

function renderDay(d) {
  // Header text
  document.getElementById('kicker').textContent = `Velocity Arena · Week ${d.week} · ${d.weekName || ''}`;
  document.getElementById('title').textContent = `Day ${d.day} — ${d.theme || ''}`;
  document.title = `Day ${d.day} — Velocity Arena`;
  document.getElementById('subtitle').textContent = '';

  // Hero
  let hero = '';
  if (d.bigMathIdea || d.vocabulary) {
    hero = `
      <div class="hero">
        <div class="hero-row">
          ${d.bigMathIdea ? `
            <div class="hero-item">
              <div class="hero-label">Big math idea</div>
              <div class="hero-value">${escapeHTML(d.bigMathIdea)}</div>
            </div>
          ` : ''}
          ${d.vocabulary ? `
            <div class="hero-item">
              <div class="hero-label">Vocabulary</div>
              <div class="hero-value">${escapeHTML(d.vocabulary)}</div>
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }

  // Activities as phases
  const phases = (d.activities || []).map(renderPhase).join('');

  document.getElementById('main').innerHTML = hero + phases;
}

function renderEmpty(n) {
  document.getElementById('kicker').textContent = 'Velocity Arena';
  document.getElementById('title').textContent = `Day ${n} not found`;
  document.getElementById('subtitle').textContent = 'Pick a day from the dropdown above.';
  document.getElementById('main').innerHTML = `
    <div class="empty">
      <h2>No data for Day ${n}</h2>
      <p>days-default.js doesn't have an entry for this day yet.</p>
    </div>
  `;
}

function populateSelect(currentDay) {
  const sel = document.getElementById('day-select');
  sel.innerHTML = days.map(d =>
    `<option value="${d.day}" ${d.day === currentDay ? 'selected' : ''}>Day ${d.day} — ${escapeHTML((d.theme || '').split(':')[0] || 'Untitled')}</option>`
  ).join('');
}

function setNav(currentDay) {
  const allNums = days.map(d => d.day).sort((a,b) => a - b);
  const idx = allNums.indexOf(currentDay);
  const prev = idx > 0 ? allNums[idx - 1] : null;
  const next = idx >= 0 && idx < allNums.length - 1 ? allNums[idx + 1] : null;
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  if (prev != null) { prevBtn.href = `?day=${prev}`; prevBtn.classList.remove('disabled'); }
  else { prevBtn.href = '#'; prevBtn.classList.add('disabled'); }
  if (next != null) { nextBtn.href = `?day=${next}`; nextBtn.classList.remove('disabled'); }
  else { nextBtn.href = '#'; nextBtn.classList.add('disabled'); }
}

function goToDay(n) {
  location.search = '?day=' + n;
}

// ── Init ──
populateSelect(dayNum);
setNav(dayNum);
if (day) renderDay(day);
else renderEmpty(dayNum);
</script>

</body>
</html>
