<!DOCTYPE html>
<html lang="en">
<head>
<!-- vla-teacher-gate:start -->
<script>
(function(){
  var KEY = "va_teacher_auth";
  if (localStorage.getItem(KEY) === "1") return;
  document.documentElement.style.visibility = "hidden";
  function bounce() { location.href = "/teachers.html"; }
  var s = document.createElement("script");
  s.src = "/config.js";
  s.onload = function() {
    var pw = (typeof CONFIG !== "undefined" && CONFIG.teacherPassword) || "";
    var ans = prompt("Teacher password required:");
    if (ans !== null && ans.trim() === String(pw).trim()) {
      localStorage.setItem(KEY, "1");
      document.documentElement.style.visibility = "";
    } else { bounce(); }
  };
  s.onerror = bounce;
  document.head.appendChild(s);
})();
</script>
<!-- vla-teacher-gate:end -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Velocity Arena — Facilitator Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1E3A5F;
  --gold:#D4A017;
  --blue:#2563EB;
  --red:#DC2626;
  --orange:#EA7C2F;
  --gray:#6B7280;
  --bg:#F4F6FA;
  --white:#FFFFFF;
  --text:#1A202C;
  --text-muted:#64748B;
  --radius:10px;
  --sidebar:240px;
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sidebar);min-width:var(--sidebar);position:fixed;top:0;left:0;height:100vh;
  background:var(--navy);overflow-y:auto;z-index:100;padding:0 0 24px;
}
.sidebar-logo{
  padding:20px 16px 12px;border-bottom:1px solid rgba(255,255,255,.12);
  color:var(--gold);font-weight:800;font-size:13px;letter-spacing:1px;text-transform:uppercase;
  line-height:1.3;
}
.sidebar-logo span{display:block;color:rgba(255,255,255,.5);font-size:10px;font-weight:500;letter-spacing:.5px;margin-top:2px}
.sidebar-back{
  display:flex;align-items:center;gap:6px;margin:12px 16px 4px;padding:8px 12px;
  background:rgba(212,160,23,.12);border:1px solid rgba(212,160,23,.35);border-radius:6px;
  color:var(--gold);text-decoration:none;font-size:11.5px;font-weight:600;letter-spacing:.3px;
  transition:background .15s,border-color .15s;
}
.sidebar-back:hover{background:rgba(212,160,23,.22);border-color:var(--gold)}
.header-back{
  display:none;align-items:center;gap:6px;margin-bottom:12px;padding:6px 12px;
  background:#fff;border:1px solid #d1d9e6;border-radius:6px;color:var(--navy);
  text-decoration:none;font-size:12px;font-weight:600;width:fit-content;
}
.header-back:hover{border-color:var(--navy)}
.nav-week{
  padding:16px 16px 4px;color:var(--gold);font-size:10px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;
}
.nav-day{
  display:block;padding:7px 16px;color:rgba(255,255,255,.75);text-decoration:none;
  font-size:11.5px;font-weight:500;border-left:3px solid transparent;
  transition:all .15s;line-height:1.3;
}
.nav-day:hover{background:rgba(255,255,255,.08);color:#fff;border-left-color:var(--gold)}
.nav-wd{color:rgba(255,255,255,.4);font-size:10px;margin-left:4px}
.nav-theme{display:block;font-size:10px;color:rgba(255,255,255,.4);font-weight:400;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── MAIN ── */
.main{margin-left:var(--sidebar);flex:1;padding:32px 40px 80px;max-width:1000px}

/* ── PAGE HEADER ── */
.page-header{margin-bottom:36px;padding-bottom:24px;border-bottom:3px solid var(--navy)}
.page-header h1{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-.5px;line-height:1.2}
.page-header p{color:var(--text-muted);font-size:13px;margin-top:6px;font-weight:500}
.page-meta{display:flex;gap:20px;margin-top:14px;flex-wrap:wrap}
.meta-chip{background:var(--white);border:1px solid #E2E8F0;border-radius:6px;padding:6px 12px;font-size:12px;color:var(--text);font-weight:600}
.meta-chip span{color:var(--text-muted);font-weight:400;margin-left:4px}

/* ── DAY CARD ── */
.day-card{background:var(--white);border-radius:var(--radius);margin-bottom:28px;
  box-shadow:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
  border:1px solid #E2E8F0;overflow:hidden}
.day-header{background:var(--navy);padding:18px 24px}
.day-meta{font-size:10.5px;color:rgba(255,255,255,.55);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.day-title{font-size:18px;font-weight:800;color:#fff;line-height:1.25}
.day-body{padding:20px 24px;display:flex;flex-direction:column;gap:10px}
.day-idea{font-size:12px;color:rgba(255,255,255,.85);font-weight:500;margin-top:8px;line-height:1.5}
.day-idea b{color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.6px;font-size:10.5px;display:block;margin-bottom:2px}

/* ── ACTIVITY BLOCK ── */
.block{border-left:4px solid #ddd;border-radius:8px;padding:14px 16px;
  background:#F9FAFB;position:relative}
.block-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.block-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.block-type{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:#fff;padding:2px 8px;border-radius:20px}
.block-time{font-size:12px;font-weight:600;color:var(--text-muted);font-variant-numeric:tabular-nums}
.block-dur{font-size:11px;color:var(--text-muted);font-weight:500}
.block-badges{display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px}
.badge-hands{background:#FEF3C7;color:#92400E}
.badge-digital{background:#DBEAFE;color:#1E40AF}
.block-title{font-size:14.5px;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:5px}
.block-desc{font-size:12.5px;color:#374151;line-height:1.55;margin-bottom:8px}

/* ── LINKS ── */
.links-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.link-chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;font-weight:600;
  color:var(--navy);background:#EEF2FF;
  border:1px solid #C7D7F9;
  border-radius:20px;padding:4px 10px;
  text-decoration:none;transition:all .15s;
  white-space:nowrap;
}
.link-chip:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.link-chip svg{flex-shrink:0;opacity:.6}

/* ── LUNCH BLOCK ── */
.block-lunch{
  border-radius:8px;
  background:repeating-linear-gradient(45deg,#FFF9E6,#FFF9E6 10px,#FFFDF5 10px,#FFFDF5 20px);
  border:1.5px dashed var(--gold);
  padding:14px 18px;
}
.block-lunch-inner{display:flex;align-items:flex-start;gap:14px}
.lunch-icon{font-size:28px;flex-shrink:0;margin-top:2px}
.lunch-title{font-size:15px;font-weight:700;color:var(--navy)}
.lunch-meta{font-size:12px;color:var(--text-muted);margin-top:3px;font-weight:500}
.lunch-note{font-size:12.5px;color:#374151;margin-top:5px}

/* ── ENDS BOX ── */
.ends-box{
  margin-top:6px;
  border:1.5px solid var(--navy);
  border-radius:8px;
  padding:14px 18px;
  background:#EFF4FA;
}
.ends-header{font-size:11px;font-weight:700;color:var(--navy);letter-spacing:.8px;
  text-transform:uppercase;margin-bottom:8px}
.ends-prompt{font-size:13px;color:var(--text);line-height:1.55;font-style:italic}
.ends-los{font-size:11.5px;color:var(--text-muted);margin-top:8px;line-height:1.5}

@media(max-width:900px){
  .sidebar{display:none}
  .main{margin-left:0;padding:20px 16px 60px}
  .header-back{display:inline-flex}
}
@media print{
  .sidebar{display:none}
  .main{margin-left:0;padding:0}
  .block{page-break-inside:avoid}
  .day-card{page-break-inside:avoid;page-break-after:always;box-shadow:none;border:1px solid #ccc}
  .link-chip{color:var(--navy)!important;border-color:#ccc}
}
</style>
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-logo">Velocity Arena<span>Facilitator Schedule</span></div>
  <a class="sidebar-back" href="/teachers.html">← Back to Teachers</a>
  <div id="sidebar-nav"><!-- populated by JS --></div>
</nav>
<main class="main">
  <div class="page-header">
    <a class="header-back" href="/teachers.html">← Back to Teachers</a>
    <h1>Velocity Arena: The Quantified Sport</h1>
    <p>Facilitator-Facing Day-by-Day Schedule — All links are live and clickable</p>
    <div class="page-meta">
      <div class="meta-chip">20 Days <span>across 4 weeks</span></div>
      <div class="meta-chip" id="meta-mins"><span>instructional</span></div>
      <div class="meta-chip" id="meta-links"><span>resource links</span></div>
      <div class="meta-chip">Platform: <span>BBC micro:bit v2 + Cutebot Pro</span></div>
    </div>
  </div>

  <div id="day-cards"><!-- populated by JS --></div>
</main>

<script src="/config.js"></script>
<script src="/days-default.js"></script>
<script src="/days-tn.js"></script>
<script src="/days.js"></script>
<script src="/lessons.js"></script>
<script>
// ─────────────────────────────────────────────────────────────
// Render the facilitator schedule from days.js + lessons.js.
// Source of truth is the activity data; this page is a view.
// ─────────────────────────────────────────────────────────────

const WEEK_HEADINGS = {
  1: 'Play Lab + Boot Camp',
  2: 'Season 1',
  3: "Commissioner's Week + Season 2",
  4: 'Championship + Exhibition',
};
const WEEKDAY_ABBREV = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// Map a block string to a {kind, color, bg} triple. Drives the
// pill color and the card's left-border accent.
const BLOCK_PALETTE = [
  { match:/^(ice breaker|warm.?up|hook|opener)/i,
    label:'Hook',           color:'#D4A017', bg:'#FEF9E7' },
  { match:/^(open lab|reflect|wind.?down|ends|closing|debrief|journal)/i,
    label:'Open Lab',       color:'#EA7C2F', bg:'#FEF6E7' },
  { match:/^(match.?build.?make|match|build.?make)/i,
    label:'Match-Build-Make', color:'#DC2626', bg:'#FEF2F2' },
  { match:/^(challenge|diagnostic)/i,
    label:'Challenge Block', color:'#2563EB', bg:'#EFF6FF' },
  { match:/^(lx setup|setup|transition)/i,
    label:'Setup',           color:'#2563EB', bg:'#EFF6FF' },
  { match:/^(activity|discussion|exhibition)/i,
    label:'Activity',        color:'#2563EB', bg:'#EFF6FF' },
];
function paletteFor(blockStr) {
  const p = BLOCK_PALETTE.find(p => p.match.test(blockStr || ''));
  return p || { label: blockStr || 'Activity', color: '#6B7280', bg: '#F3F4F6' };
}

const LINK_ICON =
  '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Coerce string | {url,label} | array of either → [{url, label}]
function asLinks(v) {
  if (v == null) return [];
  const items = Array.isArray(v) ? v : [v];
  return items
    .map(item => typeof item === 'string'
      ? { url: item, label: null }
      : { url: item.url, label: item.label || null })
    .filter(x => x.url);
}

function normUrl(u) {
  return String(u || '').replace(/^https?:\/\/[^/]+/, '').replace(/\/+$/, '');
}

// Compute weekday from camp start + day number, skipping weekends.
function weekdayForDay(dayNum) {
  try {
    const startISO = (window.CONFIG && CONFIG.startDate) || '2026-04-18';
    const d = new Date(startISO + 'T00:00:00');
    let weekdaysFound = 0;
    while (true) {
      const dow = d.getDay();
      if (dow !== 0 && dow !== 6) {
        weekdaysFound++;
        if (weekdaysFound === dayNum) return WEEKDAY_ABBREV[dow];
      }
      d.setDate(d.getDate() + 1);
      if (weekdaysFound > 30) break; // safety
    }
  } catch (e) {}
  return '';
}

// Compute time-of-day slot strings from cumulative mins, default
// start 10:00 AM. Returns '10:05–10:25' style strings.
function timeFromMin(min0, mins) {
  const dayStartMin = 10 * 60; // 10:00 AM
  const startTotal = dayStartMin + min0;
  const endTotal = startTotal + mins;
  const fmt = total => {
    let h = Math.floor(total / 60);
    const m = total % 60;
    const suffix = h >= 12 ? 'p' : 'a';
    if (h > 12) h -= 12;
    if (h === 0) h = 12;
    // Show e.g. "10:05" (no AM/PM for compactness; trailing 'p' not needed
    // because every camp activity falls into one half-day window).
    return h + ':' + String(m).padStart(2, '0');
  };
  return fmt(startTotal) + '–' + fmt(endTotal);
}

// Heuristic for the badge: digital if there's a webpage or quickCard or
// makecode link; hands-on otherwise. Activities can have both — only one
// badge shown for visual cleanliness.
function badgeFor(activity) {
  if (activity.webpage || activity.makecode || activity.quickCard) {
    return '<span class="badge badge-digital">🛜 Digital</span>';
  }
  return '<span class="badge badge-hands">🙌 Hands-On</span>';
}

// One activity block. Returns HTML.
function renderBlock(activity, runStartMin) {
  const isLunch = /lunch/i.test(activity.name || '');
  const isBreak = /^break$/i.test(activity.name || '') || /^break$/i.test(activity.block || '');
  const isReset = /energy reset/i.test(activity.name || '');
  const palette = paletteFor(activity.block || activity.name);
  const mins = Number(activity.mins) || 0;
  const time = timeFromMin(runStartMin, mins);

  if (isLunch) {
    return `
      <div class="block-lunch">
        <div class="block-lunch-inner">
          <div class="lunch-icon">🥪</div>
          <div>
            <div class="lunch-title">${escapeHtml(activity.name)}</div>
            <div class="lunch-meta">${escapeHtml(time)} · ${mins} min</div>
            ${activity.description ? `<div class="lunch-note">${escapeHtml(activity.description)}</div>` : ''}
          </div>
        </div>
      </div>`;
  }

  // Compact treatment for short between-activity gaps.
  if (isBreak || isReset) {
    return `
      <div class="block" style="border-left-color:#9CA3AF;background:#F3F4F6;padding:8px 14px">
        <div class="block-header" style="margin-bottom:0">
          <div class="block-left">
            <span class="block-type" style="background:#9CA3AF">Break</span>
            <span class="block-time">${escapeHtml(time)}</span>
            <span class="block-dur">${mins} min</span>
          </div>
        </div>
        <div class="block-title" style="margin-bottom:0;font-size:13px">${escapeHtml(activity.name)}</div>
      </div>`;
  }

  // Build link chips. Worksheet/webpage/etc. honor optional {url, label}.
  // Lessons.js entries only render if their URL isn't already a webpage.
  const webpageNorm = new Set(asLinks(activity.webpage).map(l => normUrl(l.url)));
  const chips = [];
  const pushChip = (link, defaultLabel) => {
    chips.push(
      `<a class="link-chip" href="${escapeHtml(link.url)}" target="_blank">` +
      LINK_ICON + escapeHtml(link.label || defaultLabel) + '</a>'
    );
  };

  asLinks(activity.script).forEach(l    => pushChip(l, 'Facilitator Script'));
  asLinks(activity.worksheet).forEach(l => pushChip(l, 'Worksheet'));
  asLinks(activity.webpage).forEach(l   => pushChip(l, 'Web page'));

  const lessonLinks = (typeof getLessonLinks === 'function') ? getLessonLinks(activity.name) : [];
  for (const ll of lessonLinks) {
    if (webpageNorm.has(normUrl(ll.url))) continue;
    pushChip(ll, 'Web page');
  }

  asLinks(activity.quickCard).forEach(l => pushChip(l, 'Quick card'));
  asLinks(activity.template).forEach(l  => pushChip(l, 'Template'));
  asLinks(activity.makecode).forEach(l  => pushChip(l, 'MakeCode'));
  asLinks(activity.exit).forEach(l      => pushChip(l, 'Exit ticket'));

  const desc = activity.facilitatorDescription || activity.description || '';

  return `
    <div class="block" style="border-left-color:${palette.color};background:${palette.bg}">
      <div class="block-header">
        <div class="block-left">
          <span class="block-type" style="background:${palette.color}">${escapeHtml(palette.label)}</span>
          <span class="block-time">${escapeHtml(time)}</span>
          <span class="block-dur">${mins} min</span>
        </div>
        <div class="block-badges">${badgeFor(activity)}</div>
      </div>
      <div class="block-title">${escapeHtml(activity.name)}</div>
      ${desc ? `<div class="block-desc">${escapeHtml(desc)}</div>` : ''}
      ${chips.length ? `<div class="links-row">${chips.join('')}</div>` : ''}
    </div>`;
}

function renderDayCard(day) {
  const weekName = WEEK_HEADINGS[day.week] || ('Week ' + day.week);
  const wd = weekdayForDay(day.day);
  const wdLong = ({ Mon:'Monday', Tue:'Tuesday', Wed:'Wednesday', Thu:'Thursday', Fri:'Friday' })[wd] || wd;

  let runStartMin = 0;
  const blocksHtml = (day.activities || []).map(a => {
    const html = renderBlock(a, runStartMin);
    runStartMin += (Number(a.mins) || 0);
    return html;
  }).join('');

  const ideaHtml = day.bigMathIdea
    ? `<div class="day-idea"><b>Big math idea</b>${escapeHtml(day.bigMathIdea)}</div>`
    : '';

  return `
    <div class="day-card" id="day-${day.day}">
      <div class="day-header">
        <div class="day-meta">WEEK ${String(day.week).padStart(2,'0')}: ${escapeHtml(weekName.toUpperCase())}${wdLong ? ' · ' + escapeHtml(wdLong) : ''}</div>
        <div class="day-title">Day ${day.day}: ${escapeHtml(day.theme || '')}</div>
        ${ideaHtml}
      </div>
      <div class="day-body">${blocksHtml}</div>
    </div>`;
}

function renderSidebarNav() {
  const root = document.getElementById('sidebar-nav');
  if (!root || typeof DAYS === 'undefined') return;
  let html = '';
  let lastWeek = -1;
  for (const d of DAYS) {
    if (d.week !== lastWeek) {
      lastWeek = d.week;
      html += `<div class="nav-week">Week ${d.week}</div>`;
    }
    const wd = weekdayForDay(d.day);
    const theme = d.theme || '';
    const themeShort = theme.length > 36 ? theme.slice(0, 35) + '…' : theme;
    html += `<a class="nav-day" href="#day-${d.day}">Day ${d.day} <span class="nav-wd">${escapeHtml(wd)}</span><span class="nav-theme">${escapeHtml(themeShort)}</span></a>`;
  }
  root.innerHTML = html;
}

function renderDayCards() {
  const root = document.getElementById('day-cards');
  if (!root || typeof DAYS === 'undefined') return;
  root.innerHTML = DAYS.map(renderDayCard).join('');
}

function renderMetaChips() {
  if (typeof DAYS === 'undefined') return;
  let totalMins = 0;
  let totalLinks = 0;
  for (const d of DAYS) {
    for (const a of (d.activities || [])) {
      if (!/lunch/i.test(a.name || '')) totalMins += (Number(a.mins) || 0);
      ['script','worksheet','webpage','quickCard','template','makecode','exit'].forEach(k => {
        totalLinks += asLinks(a[k]).length;
      });
      if (typeof getLessonLinks === 'function') {
        const webNorm = new Set(asLinks(a.webpage).map(l => normUrl(l.url)));
        for (const ll of getLessonLinks(a.name)) {
          if (!webNorm.has(normUrl(ll.url))) totalLinks++;
        }
      }
    }
  }
  const avgMinsPerDay = DAYS.length ? Math.round(totalMins / DAYS.length) : 0;
  const minsEl = document.getElementById('meta-mins');
  if (minsEl) minsEl.innerHTML = `~${avgMinsPerDay} min/day <span>instructional</span>`;
  const linksEl = document.getElementById('meta-links');
  if (linksEl) linksEl.innerHTML = `${totalLinks} resource links`;
}

renderSidebarNav();
renderDayCards();
renderMetaChips();
</script>
</body>
</html>
