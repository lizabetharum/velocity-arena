<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velocity Arena — Bot Challenges</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ──────────────────────────────────────────────────── */
:root {
  --bg:       #07080d;
  --surface:  #0d0f17;
  --surface2: #12141d;
  --border:   #1c1e2d;
  --text:     #e2e8f0;
  --muted:    #64748b;
  --dim:      #3a3f5c;
  --early:    #4ade80;
  --early-bg: rgba(74,222,128,0.08);
  --early-glow: rgba(74,222,128,0.22);
  --mid:      #60a5fa;
  --mid-bg:   rgba(96,165,250,0.08);
  --mid-glow: rgba(96,165,250,0.22);
  --late:     #fb923c;
  --late-bg:  rgba(251,146,60,0.08);
  --late-glow: rgba(251,146,60,0.22);
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family: 'Nunito', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
}

/* ── FIELD GRID BACKGROUND ──────────────────────────────────────────── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.016) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.016) 1px, transparent 1px);
  background-size: 44px 44px;
  pointer-events: none;
  z-index: 0;
}

/* ── HEADER ─────────────────────────────────────────────────────────── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(7,8,13,0.88);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px 12px;
}
.header-inner { max-width: 1360px; margin: 0 auto; }
.header-top { display:flex; align-items:center; gap:14px; flex-wrap:wrap; row-gap:8px; margin-bottom:12px; }

.logo { display:flex; align-items:center; gap:10px; }
.logo-icon { display:flex; align-items:center; animation:botBounce 2.8s ease-in-out infinite; }
@keyframes botBounce {
  0%,100%{ transform:translateY(0) rotate(0deg); }
  40%{ transform:translateY(-4px) rotate(-3deg); }
  60%{ transform:translateY(-2px) rotate(2deg); }
}
.logo-text { display:flex; flex-direction:column; gap:1px; }
.logo-eyebrow {
  font-family:'Chakra Petch',sans-serif;
  font-size:0.58rem; font-weight:600;
  color:var(--muted); letter-spacing:0.14em; text-transform:uppercase;
}
.logo-title {
  font-family:'Chakra Petch',sans-serif;
  font-size:1.15rem; font-weight:700; line-height:1;
  background: linear-gradient(100deg, var(--early) 0%, var(--mid) 50%, var(--late) 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
}

.header-meta { display:flex; gap:6px; flex-wrap:wrap; margin-left:auto; align-items:center; }
.pill {
  font-size:0.67rem; padding:3px 9px; border-radius:20px;
  background:rgba(255,255,255,0.04); border:1px solid var(--border);
  color:var(--muted); white-space:nowrap;
}
.pill.live { border-color:rgba(74,222,128,0.3); color:var(--early); background:rgba(74,222,128,0.06); }
.live-dot {
  display:inline-block; width:6px; height:6px; border-radius:50%;
  background:var(--early); margin-right:4px; vertical-align:middle;
  animation: liveBlink 2s ease-in-out infinite;
}
@keyframes liveBlink {
  0%,100%{ opacity:1; box-shadow:0 0 5px var(--early); }
  50%{ opacity:0.4; box-shadow:none; }
}

/* Tab bar */
.tab-bar { display:flex; gap:6px; flex-wrap:wrap; }
.tab-btn {
  font-family:'Chakra Petch',sans-serif;
  padding:6px 18px; border-radius:6px;
  border:1px solid var(--border); background:rgba(255,255,255,0.03);
  color:var(--muted); font-size:0.78rem; font-weight:600;
  cursor:pointer; transition:all 0.18s ease;
  letter-spacing:0.05em; text-transform:uppercase;
}
.tab-btn:hover { border-color:var(--dim); color:var(--text); }
.tab-btn.a-all  { background:rgba(255,255,255,0.07); border-color:#4a5568; color:#fff; }
.tab-btn.a-early { background:var(--early-bg); border-color:var(--early); color:var(--early); box-shadow:0 0 14px var(--early-glow); }
.tab-btn.a-mid   { background:var(--mid-bg);   border-color:var(--mid);   color:var(--mid);   box-shadow:0 0 14px var(--mid-glow); }
.tab-btn.a-late  { background:var(--late-bg);  border-color:var(--late);  color:var(--late);  box-shadow:0 0 14px var(--late-glow); }

/* ── GRID ───────────────────────────────────────────────────────────── */
.grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(355px, 1fr));
  gap:18px; max-width:1360px; margin:24px auto; padding:0 18px;
  position:relative; z-index:1;
}

/* ── CARD ───────────────────────────────────────────────────────────── */
@keyframes cardIn {
  from { opacity:0; transform:translateY(30px) scale(0.95); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--tc, #2d3148);
  border-radius: 16px;
  overflow: hidden;
  display: flex; flex-direction: column;
  position: relative;
  animation: cardIn 0.48s cubic-bezier(0.22,1,0.36,1) both;
  transition: transform 0.24s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.24s ease, border-color 0.2s, opacity 0.3s;
}
.card:hover {
  transform: translateY(-6px) scale(1.009);
  border-left-color: var(--tc, #4a5568);
  box-shadow:
    0 22px 55px rgba(0,0,0,0.55),
    0 0 0 1px rgba(255,255,255,0.04),
    0 0 50px var(--tg, transparent);
}

/* Shimmer sweep on hover */
.card::after {
  content:'';
  position:absolute; inset:0;
  background: linear-gradient(112deg, transparent 30%, rgba(255,255,255,0.028) 50%, transparent 70%);
  transform: translateX(-130%);
  transition: transform 0.65s ease;
  pointer-events:none; z-index:10;
}
.card:hover::after { transform: translateX(130%); }

.card.hidden { display:none; }
.card.complete { opacity:0.38; filter:saturate(0.25) brightness(0.9); }
.card.complete .done-btn { color:var(--early); border-color:rgba(74,222,128,0.35); background:rgba(74,222,128,0.08); }

/* BIG watermark number behind card content */
.wm {
  position:absolute; right:6px; top:-12px;
  font-family:'Chakra Petch',sans-serif;
  font-size:8rem; font-weight:700; line-height:1;
  color:rgba(255,255,255,0.022);
  pointer-events:none; user-select:none; z-index:0;
}

/* ── CARD TOP ──────────────────────────────────────────────────────── */
.card-top {
  padding:14px 16px 12px;
  border-bottom:1px solid var(--border);
  position:relative; z-index:1;
  background: linear-gradient(160deg, rgba(255,255,255,0.012) 0%, transparent 100%);
}
.card-row1 { display:flex; align-items:center; gap:9px; margin-bottom:9px; }
.card-num {
  font-family:'Chakra Petch',sans-serif;
  font-size:0.65rem; font-weight:700;
  color:var(--tc, var(--dim));
  background:var(--tdb, rgba(255,255,255,0.05));
  border:1px solid var(--tcb, var(--border));
  padding:2px 8px; border-radius:5px; letter-spacing:0.04em;
  white-space:nowrap;
}
.card-name {
  font-family:'Chakra Petch',sans-serif;
  font-size:1.05rem; font-weight:700; color:#fff;
  line-height:1.2; flex:1;
}
.badges { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
.badge {
  font-family:'Chakra Petch',sans-serif;
  font-size:0.62rem; font-weight:700;
  padding:3px 8px; border-radius:5px;
  letter-spacing:0.05em; white-space:nowrap; text-transform:uppercase;
}
.badge::before {
  content:'';
  display:inline-block; width:5px; height:5px; border-radius:50%;
  margin-right:5px; vertical-align:middle;
  animation: dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse {
  0%,100%{ opacity:1; transform:scale(1); }
  50%{ opacity:0.4; transform:scale(0.6); }
}
.b-early { background:var(--early-bg); color:var(--early); border:1px solid rgba(74,222,128,0.3); }
.b-early::before { background:var(--early); box-shadow:0 0 4px var(--early); }
.b-mid   { background:var(--mid-bg);   color:var(--mid);   border:1px solid rgba(96,165,250,0.3); }
.b-mid::before   { background:var(--mid);   box-shadow:0 0 4px var(--mid); }
.b-late  { background:var(--late-bg);  color:var(--late);  border:1px solid rgba(251,146,60,0.3); }
.b-late::before  { background:var(--late);  box-shadow:0 0 4px var(--late); }
.b-time  { background:rgba(255,255,255,0.05); color:var(--muted); border:1px solid var(--border); }
.b-time::before { display:none; }

/* ── PROGRAM BADGE ─────────────────────────────────────────────────── */
.prog-badge {
  display:inline-flex; align-items:center; gap:5px;
  font-family:'Chakra Petch',sans-serif;
  font-size:0.62rem; font-weight:700;
  padding:3px 9px; border-radius:5px;
  letter-spacing:0.04em; text-transform:uppercase;
}
.prog-speed     { background:rgba(251,211,141,0.10); color:#fbd38d; border:1px solid rgba(251,211,141,0.25); }
.prog-endurance { background:rgba(252,129,129,0.10); color:#fc8181; border:1px solid rgba(252,129,129,0.25); }
.prog-turning   { background:rgba(159,122,234,0.10); color:#b794f4; border:1px solid rgba(159,122,234,0.25); }
.prog-charge    { background:rgba(237,137,54,0.10);  color:#f6ad55; border:1px solid rgba(237,137,54,0.25); }
.prog-power     { background:rgba(237,100,54,0.10);  color:#fc8181; border:1px solid rgba(237,100,54,0.25); }
.prog-match     { background:rgba(96,165,250,0.10);  color:#60a5fa; border:1px solid rgba(96,165,250,0.25); }
.prog-custom    { background:rgba(72,210,190,0.10);  color:#4fd1c5; border:1px solid rgba(72,210,190,0.25); }

/* ── ROLES ──────────────────────────────────────────────────────────── */
.roles {
  display:flex; gap:14px; flex-wrap:wrap;
  padding:7px 16px;
  background:rgba(0,0,0,0.22); border-bottom:1px solid var(--border);
}
.role { font-size:0.68rem; color:var(--muted); display:flex; align-items:center; gap:4px; }

/* ── CARD BODY ──────────────────────────────────────────────────────── */
.card-body {
  padding:14px 16px; flex:1;
  display:flex; flex-direction:column; gap:13px;
  position:relative; z-index:1;
}

.sec-label {
  font-family:'Chakra Petch',sans-serif;
  font-size:0.6rem; font-weight:700;
  text-transform:uppercase; letter-spacing:0.12em;
  color:var(--dim); margin-bottom:6px;
  display:flex; align-items:center; gap:7px;
}
.sec-label::after {
  content:''; flex:1; height:1px;
  background: linear-gradient(90deg, var(--border), transparent);
}

/* ── CONTROLS ───────────────────────────────────────────────────────── */
.controls-box {
  background:#070910;
  border:1px solid var(--border);
  border-top:2px solid var(--tc, var(--border));
  border-radius:0 0 9px 9px; padding:10px 13px;
}
.ctrl-label {
  font-family:'Chakra Petch',sans-serif;
  font-size:0.58rem; font-weight:700;
  color:var(--tc, #b794f4);
  text-transform:uppercase; letter-spacing:0.1em; margin-bottom:7px;
}
.ctrl-row {
  font-family:'JetBrains Mono','Courier New',monospace;
  font-size:0.68rem; color:#7a8aaa; line-height:1.8;
}
.ctrl-row strong {
  color:#e2e8f0;
  background:rgba(255,255,255,0.07);
  padding:1px 5px; border-radius:3px; font-size:0.63rem;
  margin-right:3px;
}

/* ── SETUP STEPS (interactive) ──────────────────────────────────────── */
.steps { list-style:none; display:flex; flex-direction:column; gap:5px; }
.step-item {
  font-size:0.78rem; color:#a0aec0;
  padding:5px 10px 5px 34px;
  position:relative; line-height:1.45;
  border-radius:7px; cursor:pointer;
  transition:background 0.15s, opacity 0.22s;
}
.step-item:hover { background:rgba(255,255,255,0.03); }
.step-item::before {
  content:attr(data-n);
  position:absolute; left:7px; top:6px;
  font-family:'Chakra Petch',sans-serif;
  font-size:0.56rem; font-weight:700;
  background:var(--tdb, var(--border));
  color:var(--tc, var(--muted));
  width:19px; height:19px; border-radius:4px;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--tcb, var(--border));
  transition:background 0.15s, color 0.15s;
}
.step-item.done { opacity:0.4; text-decoration:line-through; text-decoration-color:rgba(255,255,255,0.15); }
.step-item.done::before { content:'✓'; background:rgba(74,222,128,0.12); color:var(--early); border-color:rgba(74,222,128,0.4); }

/* ── CHALLENGE TEXT ─────────────────────────────────────────────────── */
.challenge-text {
  font-size:0.8rem; color:#b0bcd4; line-height:1.6;
}
.challenge-text strong { color:#e2e8f0; }
.challenge-text em { color:#6b7c99; font-style:normal; }
.challenge-text code {
  background:rgba(255,255,255,0.08); padding:2px 6px; border-radius:4px;
  font-family:'JetBrains Mono',monospace; font-size:0.76em; color:#fbd38d;
}

/* ── STARTER CODE BOX ───────────────────────────────────────────────── */
.starter-box {
  background:#05060b;
  border:1px solid var(--border);
  border-left:3px solid #4fd1c5;
  border-radius:0 9px 9px 0; overflow:hidden;
}
.starter-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 12px;
  background:rgba(79,209,197,0.06);
  border-bottom:1px solid rgba(79,209,197,0.14);
}
.starter-lang {
  font-family:'Chakra Petch',sans-serif;
  font-size:0.6rem; font-weight:700;
  color:#4fd1c5; text-transform:uppercase; letter-spacing:0.08em;
}
.copy-btn {
  font-family:'Chakra Petch',sans-serif;
  font-size:0.59rem; font-weight:700;
  color:var(--muted); background:rgba(255,255,255,0.05);
  border:1px solid var(--border); border-radius:4px;
  padding:2px 9px; cursor:pointer; transition:all 0.15s;
  letter-spacing:0.04em;
}
.copy-btn:hover { background:rgba(255,255,255,0.10); color:var(--text); }
.copy-btn.copied { color:var(--early); border-color:rgba(74,222,128,0.4); background:rgba(74,222,128,0.08); }
.starter-box pre {
  font-family:'JetBrains Mono','Courier New',monospace;
  font-size:0.68rem; color:#5e6e88; white-space:pre; line-height:1.72;
  margin:0; padding:10px 13px; overflow-x:auto;
}
.starter-box .ph { color:#f6ad55; font-weight:700; }
.starter-note {
  padding:5px 12px 7px;
  font-size:0.62rem; color:rgba(246,173,85,0.7);
  font-family:'Chakra Petch',sans-serif; letter-spacing:0.04em;
}

/* ── FORMULA BOX ────────────────────────────────────────────────────── */
.formula-box {
  background:#05060b;
  border:1px solid var(--border);
  border-left:3px solid #4ade80;
  border-radius:0 9px 9px 0; padding:10px 13px;
}
.fl {
  font-family:'JetBrains Mono','Courier New',monospace;
  font-size:0.7rem; color:#505e7a; line-height:1.9;
}
.fl strong { color:#4ade80; }
.fl em { color:#9ae6b4; font-style:normal; }

/* ── MAKECODE BLOCKS ────────────────────────────────────────────────── */
pre.blocks {
  background:rgba(255,255,255,0.025);
  border:1px dashed var(--border); border-radius:8px;
  padding:9px 12px; font-size:0.7rem;
  font-family:'JetBrains Mono',monospace; color:var(--dim);
  white-space:pre; margin:0; line-height:1.6;
}
pre.blocks::after { content:' — rendering…'; font-size:0.58rem; color:#1e2235; font-style:italic; }
.blocks-section img {
  max-width:100%; border-radius:8px;
  box-shadow:0 4px 22px rgba(0,0,0,0.7);
  display:block; background:#fff;
}

/* ── RECORD SECTION ─────────────────────────────────────────────────── */
.record-rows { display:flex; flex-direction:column; gap:7px; }
.rrow { display:flex; align-items:center; gap:7px; font-size:0.76rem; color:#8898b0; }
.rrow span { white-space:nowrap; }
.rline { flex:1; border-bottom:1px dashed var(--dim); min-width:20px; }
.runit { font-size:0.65rem; color:var(--dim); white-space:nowrap; font-family:'JetBrains Mono',monospace; }
.rblock {
  background:rgba(255,255,255,0.02); border:1px dashed var(--dim);
  border-radius:6px; padding:8px 10px; font-size:0.72rem;
  color:var(--dim); font-style:italic; min-height:38px; line-height:1.4;
}
.rrow-label { font-size:0.74rem; color:#7a8aaa; margin-bottom:3px; }

table.rtbl { width:100%; border-collapse:collapse; font-size:0.72rem; }
table.rtbl th {
  background:var(--tdb, rgba(0,0,0,0.3));
  color:var(--tc, var(--muted));
  font-weight:700; padding:6px 8px; text-align:left;
  border:1px solid var(--border);
  font-family:'Chakra Petch',sans-serif; font-size:0.6rem;
  text-transform:uppercase; letter-spacing:0.07em;
}
table.rtbl td { border:1px solid var(--border); padding:6px 8px; color:#8898b0; }
table.rtbl td.blank { background:rgba(255,255,255,0.015); color:var(--dim); font-style:italic; }

/* ── REFLECT ────────────────────────────────────────────────────────── */
.reflect {
  border-radius:0 10px 10px 0; padding:11px 14px 13px;
  position:relative; overflow:hidden;
}
.reflect.early { border-left:3px solid var(--early); background:rgba(74,222,128,0.05); }
.reflect.mid   { border-left:3px solid var(--mid);   background:rgba(96,165,250,0.05); }
.reflect.late  { border-left:3px solid var(--late);  background:rgba(251,146,60,0.05); }
.reflect::before {
  content:'?';
  position:absolute; right:8px; bottom:-12px;
  font-family:'Chakra Petch',sans-serif;
  font-size:5rem; font-weight:700; line-height:1;
  opacity:0.035; color:#fff; pointer-events:none;
}
.ref-lbl {
  font-family:'Chakra Petch',sans-serif;
  font-size:0.6rem; font-weight:700;
  text-transform:uppercase; letter-spacing:0.1em; margin-bottom:5px;
  display:flex; align-items:center; gap:6px;
}
.reflect.early .ref-lbl { color:var(--early); }
.reflect.mid   .ref-lbl { color:var(--mid); }
.reflect.late  .ref-lbl { color:var(--late); }
.ref-q { font-size:0.79rem; color:#c0cce0; line-height:1.5; font-style:italic; }

/* ── CARD FOOTER ────────────────────────────────────────────────────── */
.card-footer {
  padding:9px 16px; border-top:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(0,0,0,0.18); gap:8px;
}
.stat-hint {
  font-family:'JetBrains Mono',monospace;
  font-size:0.61rem; color:var(--dim);
}
.footer-btns { display:flex; gap:6px; }
.timer-btn {
  font-family:'Chakra Petch',sans-serif;
  background:rgba(255,255,255,0.05); border:1px solid var(--border);
  color:var(--text); padding:5px 12px; border-radius:7px;
  font-size:0.72rem; font-weight:700; cursor:pointer;
  transition:all 0.18s; letter-spacing:0.03em;
}
.timer-btn:hover {
  background:var(--tdb, rgba(255,255,255,0.09));
  border-color:var(--tc, var(--dim)); color:var(--tc, #fff);
  box-shadow:0 0 12px var(--tg, transparent);
}
.done-btn {
  font-family:'Chakra Petch',sans-serif;
  background:rgba(255,255,255,0.03); border:1px solid var(--border);
  color:var(--dim); padding:5px 10px; border-radius:7px;
  font-size:0.67rem; font-weight:700; cursor:pointer;
  transition:all 0.2s; letter-spacing:0.04em; text-transform:uppercase;
}
.done-btn:hover { background:rgba(74,222,128,0.08); border-color:rgba(74,222,128,0.35); color:var(--early); }

/* ── TIMER OVERLAY ──────────────────────────────────────────────────── */
.t-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(5,6,10,0.96);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  z-index:999; flex-direction:column;
  align-items:center; justify-content:center;
  gap:22px; padding:20px;
}
.t-overlay.open { display:flex; }
.t-overlay.flash { animation: tflash 0.55s 6; }
@keyframes tflash {
  0%,100%{ background:rgba(5,6,10,0.96); }
  50%{ background:rgba(251,146,60,0.18); }
}

.t-name {
  font-family:'Chakra Petch',sans-serif;
  font-size:0.76rem; font-weight:700; color:var(--muted);
  text-transform:uppercase; letter-spacing:0.14em; text-align:center;
}

/* SVG ring */
.t-ring-wrap { position:relative; width:270px; height:270px; }
.t-ring-svg { width:270px; height:270px; transform:rotate(-90deg); }
.t-ring-bg { fill:none; stroke:#161926; stroke-width:12; }
.t-ring-fg {
  fill:none; stroke:#4ade80; stroke-width:12; stroke-linecap:round;
  stroke-dasharray: 722.57;   /* 2 * pi * 115 */
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 1s linear, stroke 0.5s ease;
  filter: drop-shadow(0 0 8px currentColor);
}
.t-center {
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
}
.t-display {
  font-family:'Chakra Petch',sans-serif;
  font-size:clamp(56px,14vw,102px); font-weight:700;
  color:#fff; letter-spacing:0.02em; line-height:1;
  transition:color 0.3s;
}
.t-display.warn {
  color:var(--late);
  animation: urgentPulse 0.65s ease-in-out infinite;
}
@keyframes urgentPulse {
  0%,100%{ text-shadow:none; }
  50%{ text-shadow:0 0 24px rgba(251,146,60,0.7); }
}
.t-sub {
  font-family:'Chakra Petch',sans-serif;
  font-size:0.6rem; color:var(--dim);
  letter-spacing:0.12em; text-transform:uppercase; margin-top:5px;
}
.t-controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
.tb {
  font-family:'Chakra Petch',sans-serif;
  padding:11px 28px; border-radius:10px; border:none;
  font-size:0.88rem; font-weight:700; cursor:pointer;
  letter-spacing:0.05em; transition:all 0.16s; text-transform:uppercase;
}
.tb.start { background:var(--early); color:#070a0d; }
.tb.start:hover { box-shadow:0 0 22px var(--early-glow); transform:scale(1.03); }
.tb.pause { background:var(--mid); color:#fff; }
.tb.pause:hover { box-shadow:0 0 22px var(--mid-glow); transform:scale(1.03); }
.tb.reset { background:rgba(255,255,255,0.09); color:var(--text); }
.tb.close { background:transparent; color:var(--muted); border:1px solid var(--border); padding:10px 18px; }
.tb.close:hover { color:var(--text); border-color:var(--dim); }
.t-mute {
  font-family:'Chakra Petch',sans-serif;
  background:transparent; border:1px solid var(--border);
  border-radius:8px; padding:9px 14px; color:var(--dim);
  font-size:0.72rem; cursor:pointer; font-weight:700;
  letter-spacing:0.04em; transition:all 0.15s;
}
.t-mute:hover { border-color:var(--dim); color:var(--text); }
.t-mute.muted { color:var(--late); border-color:rgba(251,146,60,0.35); background:rgba(251,146,60,0.06); }

/* ── RESPONSIVE ─────────────────────────────────────────────────────── */
@media (max-width: 600px) {
  .header { padding:12px 14px 10px; }
  .grid { padding:0 10px; gap:12px; grid-template-columns:1fr; }
  .wm { font-size:6rem; }
}

/* ── SVG ICON ALIGNMENT ────────────────────────────────────────────────── */
.sec-label svg { flex-shrink:0; opacity:0.75; vertical-align:middle; }
.ref-lbl svg { flex-shrink:0; opacity:0.75; margin-right:2px; vertical-align:middle; }
.role svg { flex-shrink:0; opacity:0.65; vertical-align:middle; }
.done-btn svg, .timer-btn svg { vertical-align:middle; margin-right:2px; flex-shrink:0; }
.copy-btn svg { vertical-align:middle; flex-shrink:0; }
.tb svg { vertical-align:middle; margin-right:4px; flex-shrink:0; }
.t-mute svg { vertical-align:middle; margin-right:3px; flex-shrink:0; }
.tb.close svg { margin-right:0; }
</style>

// ── HELPERS ──────────────────────────────────────────────────────────
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function highlightCode(id){
  if (!CODE[id]) return '';
  const lines = CODE[id].split('\n');
  const hlSet = CODE_HL[id] || new Set();
  return lines.map((line, i) => {
    if (line === ' ') return '';
    const safe = esc(line);
    return hlSet.has(i) ? `<span class="ph">${safe}</span>` : safe;
  }).join('\n');
}

function renderRecord(r){
  if (!r) return '';
  if (r.type==='table'){
    const ths = r.headers.map(h=>`<th>${h}</th>`).join('');
    const trs = r.rows.map(row=>`<tr>${row.map((c,i)=>{
      const blank = i>0 && (c===''||c.includes('___')||c.includes('Y / N')||c.includes('—'));
      return `<td class="${blank?'blank':''}">${c||'&nbsp;'}</td>`;
    }).join('')}</tr>`).join('');
    return `<div style="overflow-x:auto"><table class="rtbl"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
  }
  if (r.type==='rows'){
    return `<div class="record-rows">${r.rows.map(row=>{
      if (row.u===''){
        return `<div><div class="rrow-label">${row.l}</div><div class="rblock"></div></div>`;
      }
      return `<div class="rrow"><span>${row.l}:</span><div class="rline"></div><span class="runit">${row.u}</span></div>`;
    }).join('')}</div>`;
  }
  return '';
}

// ── WEB AUDIO ────────────────────────────────────────────────────────
let audioCtx = null;
let soundMuted = false;

function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, dur, vol, type='sine') {
  if (soundMuted) return;
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    osc.start(); osc.stop(ctx.currentTime + dur + 0.01);
  } catch(e) {}
}
function tickSound() { beep(1000, 0.04, 0.07, 'sine'); }
function warnSound() { beep(1200, 0.07, 0.12, 'sine'); }
function alarmSound() {
  beep(880, 0.13, 0.35, 'square');
  setTimeout(() => beep(660, 0.13, 0.35, 'square'), 190);
  setTimeout(() => beep(880, 0.13, 0.35, 'square'), 380);
  setTimeout(() => beep(1100, 0.28, 0.42, 'sine'), 570);
}
function toggleMute() {
  soundMuted = !soundMuted;
  const btn = document.getElementById('tMuteBtn');
  if (btn) { btn.innerHTML = soundMuted ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg> Muted' : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg> Sound'; btn.classList.toggle('muted', soundMuted); }
}

// ── TIMER ────────────────────────────────────────────────────────────
const CIRC = 722.57;  // 2 * pi * 115
let tSec=0, tTotal=0, tRunning=false, tInterval=null, tTierColor='#4ade80';
const TIER_COLORS = {early:'#4ade80', mid:'#60a5fa', late:'#fb923c'};

function openTimer(id){
  const c = CHALLENGES.find(x=>x.id===id);
  if (!c) return;
  tTotal = c.minutes*60; tSec = tTotal; tRunning = false;
  clearInterval(tInterval);
  tTierColor = TIER_COLORS[c.tier]||'#4ade80';
  document.getElementById('tRingFg').style.stroke = tTierColor;
  document.getElementById('tName').textContent = `#${c.id} — ${c.name}`;
  document.getElementById('tbStart').innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg> Start';
  document.getElementById('tbStart').className = 'tb start';
  tUpdate();
  document.getElementById('tOverlay').className = 't-overlay open';
}

function tUpdate(){
  const m = Math.floor(tSec/60);
  const s = (tSec%60).toString().padStart(2,'0');
  const d = document.getElementById('tDisplay');
  d.textContent = `${m}:${s}`;
  const warn = tSec <= 30 && tSec > 0;
  d.className = 't-display' + (warn ? ' warn' : '');
  // Ring
  const fg = document.getElementById('tRingFg');
  if (fg) {
    fg.style.strokeDashoffset = tTotal > 0 ? CIRC * (1 - tSec/tTotal) : CIRC;
    fg.style.stroke = (tSec <= 30 && tSec > 0) ? '#fb923c' : (tSec <= 0 ? '#ef4444' : tTierColor);
  }
  // Sub label
  const sub = document.getElementById('tSub');
  if (sub) {
    if (tSec <= 0) sub.textContent = "TIME'S UP";
    else if (tSec <= 10) sub.textContent = 'HURRY!';
    else if (tSec <= 30) sub.textContent = 'ALMOST DONE';
    else sub.textContent = 'REMAINING';
  }
}

function tStartPause(){
  if (tSec<=0){ tReset(); return; }
  tRunning = !tRunning;
  const btn = document.getElementById('tbStart');
  if (tRunning) {
    btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> Pause'; btn.className = 'tb pause';
    tInterval = setInterval(() => {
      if (!tRunning){ clearInterval(tInterval); return; }
      tSec--;
      tUpdate();
      if (tSec <= 10 && tSec > 0) warnSound();
      else if (tSec > 0) tickSound();
      if (tSec <= 0) {
        clearInterval(tInterval); tRunning = false;
        btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg> Restart'; btn.className = 'tb start';
        alarmSound();
        const ov = document.getElementById('tOverlay');
        ov.classList.add('flash');
        setTimeout(() => ov.classList.remove('flash'), 4000);
      }
    }, 1000);
  } else {
    clearInterval(tInterval);
    btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg> Resume'; btn.className = 'tb start';
  }
}

function tReset(){
  clearInterval(tInterval); tRunning = false; tSec = tTotal;
  document.getElementById('tbStart').innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg> Start';
  document.getElementById('tbStart').className = 'tb start';
  document.getElementById('tRingFg').style.stroke = tTierColor;
  tUpdate();
}
function tClose(){
  clearInterval(tInterval); tRunning = false;
  document.getElementById('tOverlay').className = 't-overlay';
}
document.getElementById('tOverlay').addEventListener('click', function(e){ if(e.target===this) tClose(); });

// ── MAKECODE BLOCKS RENDERER ──────────────────────────────────────────
(function () {
  var MCODE_URL = 'https://makecode.microbit.org/';
  var blockId = 0;
  if (!document.querySelector('pre.blocks')) return;
  function sendBlock(pre) {
    var f = document.getElementById('makecoderenderer');
    if (!f || !f.contentWindow) return;
    f.contentWindow.postMessage({ type:'renderblocks', id:pre.id, code:pre.innerText }, MCODE_URL);
  }
  window.addEventListener('message', function (ev) {
    var msg = ev.data;
    if (!msg || msg.source !== 'makecode') return;
    if (msg.type === 'renderready') {
      document.querySelectorAll('pre.blocks').forEach(function (pre) {
        pre.id = 'pxt-' + (blockId++);
        sendBlock(pre);
      });
    } else if (msg.type === 'renderblocks' && msg.uri) {
      var pre = document.getElementById(msg.id);
      if (!pre) return;
      var img = document.createElement('img');
      img.src = msg.uri; img.alt = 'MakeCode blocks';
      img.width = msg.width || undefined; img.height = msg.height || undefined;
      pre.parentNode.insertBefore(img, pre);
      pre.parentNode.removeChild(pre);
    }
  }, false);
  var f = document.createElement('iframe');
  f.id = 'makecoderenderer';
  f.src = MCODE_URL + '--docs?render=1';
  f.setAttribute('aria-hidden','true');
  f.style.cssText = 'position:absolute;left:0;bottom:0;width:1px;height:1px;border:none;';
  document.body.appendChild(f);
}());
</script>
