<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/images/first.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall & Interleaved Dashboard — Velocity Arena</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
:root{--blue-dark:#154593;--blue-mid:#0065B3;--blue-light:#009CD6;--red:#ED1C24;--green:#1A7A3E;--white:#FFFFFF;--off-white:#F4F7FB;--gray:#626262;--light-gray:#A5A5A5;--border:#D0DCF0;--amber:#F5D799;--amber-dark:#8A5A00;}
body{font-family:'Work Sans',Arial,sans-serif;background:var(--off-white);color:#1A1A2E;min-height:100vh;line-height:1.55;}
.header{background:var(--blue-dark);padding:1.5rem 2rem;}
.header-inner{max-width:80rem;margin:0 auto;}
.header-title{font-size:1.5rem;font-weight:800;color:var(--white);}
.header-sub{font-size:0.9375rem;color:rgba(255,255,255,.7);margin-top:0.25rem;}
.main{max-width:80rem;margin:0 auto;padding:1.5rem 2rem 4rem;}

.tabs{display:flex;gap:0.5rem;margin-bottom:1.25rem;border-bottom:0.125rem solid var(--border);}
.tab{background:transparent;border:none;padding:0.875rem 1.5rem;cursor:pointer;font-family:inherit;font-size:1rem;font-weight:700;color:var(--gray);border-bottom:0.25rem solid transparent;margin-bottom:-0.125rem;}
.tab.active{color:var(--blue-dark);border-bottom-color:var(--blue-dark);}

.controls{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem;}
.site-filter{display:flex;gap:0.375rem;}
.site-btn{background:var(--white);border:0.125rem solid var(--border);border-radius:0.375rem;padding:0.5rem 0.875rem;cursor:pointer;font-family:inherit;font-size:0.875rem;font-weight:600;color:var(--gray);}
.site-btn.active{background:var(--blue-dark);border-color:var(--blue-dark);color:var(--white);}
.score-btn{background:var(--blue-dark);color:var(--white);border:none;border-radius:0.5rem;padding:0.625rem 1.125rem;cursor:pointer;font-family:inherit;font-size:0.9375rem;font-weight:700;margin-left:auto;}
.score-btn:hover{background:var(--blue-mid);}
.score-btn:disabled{background:var(--light-gray);cursor:not-allowed;}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:0.75rem;margin-bottom:1.25rem;}
.stat-card{background:var(--white);border:0.0625rem solid var(--border);border-radius:0.5rem;padding:0.875rem 1rem;}
.stat-card.warn{border-color:var(--amber);background:#FFF7E8;}
.stat-card.warn .stat-label,.stat-card.warn .stat-value{color:var(--amber-dark);}
.stat-label{font-size:0.6875rem;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.08em;}
.stat-value{font-size:1.5rem;font-weight:800;color:var(--blue-dark);margin-top:0.125rem;}
.stat-sub{font-size:0.75rem;color:var(--gray);margin-top:0.125rem;}

.table-wrap{background:var(--white);border:0.0625rem solid var(--border);border-radius:0.5rem;overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:0.875rem;}
th{background:var(--off-white);font-size:0.6875rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--blue-dark);text-align:left;padding:0.625rem 0.5rem;border-bottom:0.0625rem solid var(--border);position:sticky;top:0;z-index:1;}
td{padding:0.5rem;border-bottom:0.0625rem solid var(--border);vertical-align:top;}
tr:last-child td{border-bottom:none;}
.token{font-family:'JetBrains Mono','SF Mono',monospace;font-size:0.8125rem;font-weight:700;color:var(--blue-dark);}
.score-cell{text-align:center;font-weight:700;font-family:'JetBrains Mono',monospace;cursor:help;}
.score-cell.s1{color:var(--green);}
.score-cell.s0_5{color:var(--amber-dark);}
.score-cell.s0{color:var(--red);}
.score-cell.unscored{color:var(--light-gray);font-weight:400;}
.total-cell{text-align:center;font-weight:800;font-family:'JetBrains Mono',monospace;}
.team{font-size:0.8125rem;color:var(--gray);}
.timestamp{font-size:0.75rem;color:var(--light-gray);white-space:nowrap;}
.empty{text-align:center;padding:3rem;color:var(--gray);font-size:0.9375rem;}

.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--blue-dark);color:var(--white);padding:0.875rem 1.25rem;border-radius:0.5rem;font-size:0.875rem;font-weight:600;box-shadow:0 0.5rem 1rem rgba(0,0,0,.2);display:none;z-index:50;}
.toast.show{display:block;}
.toast.error{background:var(--red);}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-title">Recall & Interleaved Dashboard</div>
    <div class="header-sub">Day 5 Recall Check · Day 10 Cold Recall · Day 6 Interleaved Problem Set — Claude Haiku scoring</div>
  </div>
</div>

<div class="main">

  <div class="tabs">
    <button class="tab active" data-tab="day5" onclick="setTab('day5')">Day 5 Recall</button>
    <button class="tab" data-tab="day10" onclick="setTab('day10')">Day 10 Cold Recall</button>
    <button class="tab" data-tab="interleaved" onclick="setTab('interleaved')">Day 6 Interleaved</button>
  </div>

  <div class="controls">
    <div class="site-filter" id="site-filter">
      <button class="site-btn active" data-site="all" onclick="setSite('all')">All sites</button>
      <button class="site-btn" data-site="TN"  onclick="setSite('TN')">Crosstown</button>
      <button class="site-btn" data-site="NY1" onclick="setSite('NY1')">Gotham Tech</button>
      <button class="site-btn" data-site="NY2" onclick="setSite('NY2')">Claremont</button>
      <button class="site-btn" data-site="NY3" onclick="setSite('NY3')">South Bronx</button>
    </div>
    <button id="score-btn" class="score-btn" onclick="scoreCurrent()">Score new submissions</button>
  </div>

  <div class="stat-row" id="stats"></div>

  <div class="table-wrap">
    <table id="results-table">
      <thead id="results-head"></thead>
      <tbody id="results-body">
        <tr><td class="empty" colspan="20">Loading…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<div id="toast" class="toast"></div>

<script>
let STATE = { tab: 'day5', site: 'all', records: [] };

const SCORE_ENDPOINTS = {
  day5:        '/api/score-recall-day5',
  day10:       '/api/score-recall-day10',
  interleaved: '/api/score-interleaved-day6',
};
const Q_COUNT = { day5: 5, day10: 5, interleaved: 14 };
const LABELS  = { day5: 'Day 5 Recall', day10: 'Day 10 Cold Recall', interleaved: 'Interleaved Day 6' };

function setTab(t) {
  STATE.tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  render();
}
function setSite(s) {
  STATE.site = s;
  document.querySelectorAll('.site-btn').forEach(b => b.classList.toggle('active', b.dataset.site === s));
  render();
}

async function load() {
  try {
    const res = await fetch('/api/recall-dashboard');
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'load failed');
    STATE.records = data.records || [];
    render();
  } catch (e) {
    showToast('Failed to load: ' + e.message, true);
    document.getElementById('results-body').innerHTML = '<tr><td class="empty" colspan="20">Failed to load — check console</td></tr>';
  }
}

function filtered() {
  return STATE.records.filter(r => {
    if (r.variant !== STATE.tab) return false;
    if (STATE.site !== 'all' && r.state !== STATE.site) return false;
    return true;
  });
}

function render() {
  const rows = filtered();
  renderStats(rows);
  renderTable(rows);
}

function renderStats(rows) {
  const total = rows.length;
  const unscored = rows.filter(r => !r.scoredAt).length;
  const scored = total - unscored;
  const avg = scored ? (rows.filter(r => r.aiTotal != null).reduce((s, r) => s + r.aiTotal, 0) / scored) : 0;
  const possible = Q_COUNT[STATE.tab];
  const avgPct = scored ? (avg / possible * 100) : 0;

  let html = '';
  html += `<div class="stat-card"><div class="stat-label">Total submissions</div><div class="stat-value">${total}</div><div class="stat-sub">${LABELS[STATE.tab]}</div></div>`;
  if (unscored > 0) {
    html += `<div class="stat-card warn"><div class="stat-label">Awaiting scoring</div><div class="stat-value">${unscored}</div><div class="stat-sub">Click "Score new submissions"</div></div>`;
  }
  if (scored > 0) {
    html += `<div class="stat-card"><div class="stat-label">Avg score (AI)</div><div class="stat-value">${avg.toFixed(1)} / ${possible}</div><div class="stat-sub">${avgPct.toFixed(0)}% of ${possible}</div></div>`;
    html += `<div class="stat-card"><div class="stat-label">Scored</div><div class="stat-value">${scored}</div><div class="stat-sub">of ${total}</div></div>`;
  }
  document.getElementById('stats').innerHTML = html;
}

function renderTable(rows) {
  const qCount = Q_COUNT[STATE.tab];
  let head = '<tr><th>Token</th><th>Site</th><th>Team</th>';
  for (let q = 1; q <= qCount; q++) {
    const label = (STATE.tab === 'interleaved' && q > 12) ? `EC-${q === 13 ? 'A' : 'B'}` : `Q${q}`;
    head += `<th style="text-align:center;">${label}</th>`;
  }
  head += '<th style="text-align:center;">Total</th><th>Scored</th><th>Submitted</th></tr>';
  document.getElementById('results-head').innerHTML = head;

  if (rows.length === 0) {
    document.getElementById('results-body').innerHTML = `<tr><td class="empty" colspan="${qCount + 6}">No submissions yet for this tab/site.</td></tr>`;
    return;
  }

  // Sort: unscored first, then by timestamp descending
  rows.sort((a, b) => {
    if (!!a.scoredAt !== !!b.scoredAt) return a.scoredAt ? 1 : -1;
    return (b.timestamp || '').localeCompare(a.timestamp || '');
  });

  const body = rows.map(r => {
    let cells = `<td class="token">${escapeHTML(r.pseudonym || '—')}</td>`;
    cells += `<td>${escapeHTML(siteLabelFor(r.state))}</td>`;
    cells += `<td class="team">${escapeHTML(r.team || '—')}</td>`;
    for (let q = 0; q < qCount; q++) {
      const s = r.aiScores && r.aiScores[q];
      if (!s) {
        cells += `<td class="score-cell unscored">—</td>`;
      } else {
        const cls = s.score === 1 ? 's1' : s.score === 0.5 ? 's0_5' : 's0';
        const reason = (s.reason || '').replace(/"/g, '&quot;');
        cells += `<td class="score-cell ${cls}" title="${reason}">${s.score}</td>`;
      }
    }
    if (r.aiTotal != null) {
      const pct = (r.aiTotal / qCount * 100).toFixed(0);
      cells += `<td class="total-cell">${r.aiTotal} <span style="font-weight:400;color:var(--gray);font-size:0.75rem;">(${pct}%)</span></td>`;
    } else {
      cells += `<td class="score-cell unscored">—</td>`;
    }
    cells += `<td class="timestamp">${r.scoredAt ? fmtTime(r.scoredAt) : '—'}</td>`;
    cells += `<td class="timestamp">${fmtTime(r.submittedAt || r.timestamp)}</td>`;
    return `<tr>${cells}</tr>`;
  }).join('');
  document.getElementById('results-body').innerHTML = body;
}

async function scoreCurrent() {
  const btn = document.getElementById('score-btn');
  const endpoint = SCORE_ENDPOINTS[STATE.tab];
  if (!endpoint) return;
  btn.disabled = true;
  btn.textContent = 'Scoring…';
  try {
    const res = await fetch(endpoint + '?max=200', { method: 'POST' });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const msg = `Scored ${data.scored || 0} submissions${data.errors ? ' (with errors — see Network tab)' : ''}.`;
    showToast(msg);
    if (data.errors) console.warn('Scoring errors:', data.errors);
    await load();
  } catch (e) {
    showToast('Scoring failed: ' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Score new submissions';
  }
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}

function siteLabelFor(state) {
  return ({ NY1: 'Gotham Tech', NY2: 'Claremont International', NY3: 'South Bronx', TN: 'Crosstown' })[state] || state || '—';
}
function escapeHTML(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(ts) {
  if (!ts) return '—';
  try {
    const d = new Date(ts);
    if (isNaN(d.getTime())) return ts;
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch (_) { return ts; }
}

load();
</script>

</body>
</html>
